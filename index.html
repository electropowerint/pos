<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElectroPowerInt — Invoice &amp; Expense Manager</title>
  <meta name="description"
    content="Create invoices, track expenses, manage reminders and notes — all in one clean, modern web app." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Poppins:wght@300;400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' fill='%232563eb'/%3E%3Ctext x='12' y='16.5' font-size='11' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script type="module" src="firebase-init.js"></script>
</head>

<body>

  <div class="app" id="app">

    <!-- Sidebar -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <a href="#/dashboard" class="side-logo">
        <span class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <path d="M17.5 14v7M14 17.5h7" />
          </svg>
        </span>
        <span class="logo-text">ElectroPowerInt</span>
      </a>

      <nav class="side-nav" id="sideNav">
        <p class="nav-label">Menu</p>
        <a href="#/dashboard" data-route="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-6 9 6v11a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1z" />
          </svg><span>Dashboard</span></a>
        <a href="#/invoices" data-route="invoices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round">
            <path d="M6 2h12a1 1 0 011 1v19l-3-2-3 2-3-2-3 2V3a1 1 0 011-1z" />
            <path d="M9 7h6M9 11h6" />
          </svg><span>Invoices</span></a>
        <a href="#/expenses" data-route="expenses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round">
            <path d="M3 3v18h18" />
            <path d="M19 9l-5 5-4-4-3 3" />
          </svg><span>Expenses</span></a>
        <a href="#/reports" data-route="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round">
            <rect x="3" y="12" width="4" height="8" rx="1" />
            <rect x="10" y="7" width="4" height="13" rx="1" />
            <rect x="17" y="3" width="4" height="17" rx="1" />
          </svg><span>Reports</span></a>
        <p class="nav-label">Tools</p>
        <a href="#/reminders" data-route="reminders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round">
            <path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
            <path d="M13.7 21a2 2 0 01-3.4 0" />
          </svg><span>Reminders</span><b class="pill" id="reminderPill" hidden></b></a>
        <a href="#/notes" data-route="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" />
          </svg><span>Notes</span></a>
        <a href="#/whiteboard" data-route="whiteboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M8 15l2.5-5 2 3L16 8" />
          </svg><span>Whiteboard</span></a>
        <p class="nav-label">System</p>
        <a href="#/history" data-route="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
          </svg><span>History</span></a>
        <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h.01a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51h.01a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v.01a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" />
          </svg><span>Settings</span></a>
      </nav>

      <div class="side-foot">
        <div class="side-user">
          <span class="avatar-grad" id="sideBizAvatar">B</span>
          <div class="side-user-meta">
            <b id="sideBizName">My Business</b>
            <small id="sideBizTag">Free plan · Local data</small>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn hamburger" id="hamburger" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        <div class="topbar-title">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSub" class="topbar-sub"></p>
        </div>
        <div class="topbar-actions">
          <a href="#/invoices/new" class="btn btn-primary btn-sm hide-sm">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round">
              <path d="M12 5v14M5 12h14" />
            </svg>
            New Invoice
          </a>
          <a href="#/invoices/new" class="btn btn-primary btn-sm fab-sm" aria-label="New invoice">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </a>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toasts" id="toasts"></div>

  <!-- Modal -->
  <div class="modal-root" id="modalRoot" hidden>
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <h3 id="modalTitle">Are you sure?</h3>
      <p id="modalText"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-sm" id="modalCancel">Cancel</button>
        <button class="btn btn-danger btn-sm" id="modalOk">Delete</button>
      </div>
    </div>
  </div>

  <!-- Payment options -->
  <div class="modal-root" id="payRoot" hidden>
    <div class="modal-backdrop" id="payBackdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <h3 id="payTitle">Record payment</h3>
      <p id="paySub" class="muted small"></p>
      <div class="pay-opts" id="payOpts">
        <button class="btn btn-primary btn-sm" data-kind="full">Full payment</button>
        <button class="btn btn-ghost btn-sm" data-kind="half">Half payment</button>
        <button class="btn btn-ghost btn-sm" data-kind="partial">Partial payment</button>
      </div>
      <div id="payCustom" hidden>
        <input class="input" id="payAmt" type="number" min="0" step="any" placeholder="Partial amount" />
        <div class="row-between mt-2">
          <small class="muted" id="payHint"></small>
          <button class="btn btn-primary btn-sm" id="payGo">Record</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-sm" id="payCancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
